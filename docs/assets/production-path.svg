<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">Developer handoff path</title>
  <desc id="desc">Verified product work flows to developer continuation then production hardening.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579"/>
    </marker>
  </defs>
  <rect width="360" height="280" fill="#f7f6f2"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#2d3142" font-size="15" font-weight="650">
    <rect x="50" y="28" width="260" height="44" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="180" y="55" text-anchor="middle">Verified Product Work</text>
    <path d="M180 72V96" stroke="#596579" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

    <rect x="50" y="96" width="260" height="44" rx="8" fill="#fff7f2" stroke="#eb6c36" stroke-width="1.1"/>
    <text x="180" y="123" text-anchor="middle">Developer Continuation</text>
    <path d="M180 140V164" stroke="#596579" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

    <rect x="50" y="164" width="260" height="44" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="180" y="191" text-anchor="middle">Production Hardening</text>
  </g>
</svg>
