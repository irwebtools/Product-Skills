<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="400" viewBox="0 0 360 400" role="img" aria-labelledby="title desc">
  <title id="title">Default Product-Skills flow</title>
  <desc id="desc">Definition to UX UI to React to Verification to Delivery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579"/>
    </marker>
  </defs>
  <rect width="360" height="400" fill="#f7f6f2"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#2d3142" font-size="16" font-weight="650">
    <rect x="70" y="24" width="220" height="44" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="180" y="51" text-anchor="middle">Definition</text>
    <path d="M180 68V88" stroke="#596579" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

    <rect x="70" y="88" width="220" height="44" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="180" y="115" text-anchor="middle">UX / UI</text>
    <path d="M180 132V152" stroke="#596579" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

    <rect x="70" y="152" width="220" height="44" rx="8" fill="#fff7f2" stroke="#eb6c36" stroke-width="1.1"/>
    <text x="180" y="179" text-anchor="middle">React</text>
    <path d="M180 196V216" stroke="#596579" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

    <rect x="70" y="216" width="220" height="44" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="180" y="243" text-anchor="middle">Verification</text>
    <path d="M180 260V280" stroke="#596579" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

    <rect x="70" y="280" width="220" height="44" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="180" y="307" text-anchor="middle">Delivery</text>
  </g>
</svg>
