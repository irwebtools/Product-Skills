<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="img" aria-labelledby="title desc">
  <title id="title">Product-Skills relationship</title>
  <desc id="desc">Product intent flows through the Product-Skills harness and an AI Coding Agent to verified product work, then developer production.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#596579"/>
    </marker>
  </defs>
  <rect width="420" height="420" fill="#f7f6f2"/>
  <g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#2d3142">
    <rect x="70" y="28" width="280" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="210" y="58" text-anchor="middle" font-size="16" font-weight="650">Product Intent</text>
    <path d="M210 76V100" stroke="#596579" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

    <rect x="70" y="100" width="280" height="48" rx="8" fill="#fff7f2" stroke="#eb6c36" stroke-width="1.1"/>
    <text x="210" y="130" text-anchor="middle" font-size="16" font-weight="700">Product-Skills Harness</text>
    <path d="M210 148V172" stroke="#596579" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

    <rect x="70" y="172" width="280" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="210" y="202" text-anchor="middle" font-size="16" font-weight="650">AI Coding Agent</text>
    <path d="M210 220V244" stroke="#596579" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

    <rect x="70" y="244" width="280" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="210" y="274" text-anchor="middle" font-size="16" font-weight="650">Verified Product Work</text>
    <path d="M210 292V316" stroke="#596579" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>

    <rect x="70" y="316" width="280" height="48" rx="8" fill="#ffffff" stroke="#2d3142" stroke-opacity=".14"/>
    <text x="210" y="346" text-anchor="middle" font-size="16" font-weight="650">Developer Production</text>
  </g>
</svg>
