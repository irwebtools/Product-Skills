# Project-scoped MCP configuration for trusted Codex projects.
# Authentication is OAuth-based; never commit access tokens here.

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
auth = "oauth"
required = false
default_tools_approval_mode = "writes"

[mcp_servers.vercel]
url = "https://mcp.vercel.com"
auth = "oauth"
required = false
default_tools_approval_mode = "writes"

[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?read_only=true&features=docs%2Cdatabase%2Cdebugging"
auth = "oauth"
required = false
default_tools_approval_mode = "writes"
